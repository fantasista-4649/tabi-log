.stat-icon{font-size:29px;height:35px;line-height:35px;position:relative;z-index:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.12))}
.stat .label{font-size:14px;font-weight:900;white-space:nowrap;position:relative;z-index:1;line-height:1.15;text-shadow:0 1px 1px rgba(0,0,0,.12)}
.stat .num{font-size:37px;font-weight:900;line-height:1;margin-top:7px;position:relative;z-index:1}
.stat .unit{font-size:12px;font-weight:900;position:relative;z-index:1;margin-top:2px}
.section-head{margin:18px 4px 8px;align-items:center}.section-title{font-size:22px;font-weight:900}.section-title .pin{font-size:31px;color:var(--red)}.more{font-size:14px;color:var(--red);font-weight:900}
.recent-row{position:relative;display:flex;gap:10px;align-items:center;background:#fffdf7;border:1px solid #eadfc9;border-radius:16px;padding:9px;margin:8px 0;box-shadow:0 2px 8px rgba(115,70,30,.10);min-height:78px}.recent-photo{width:64px;height:64px;flex-basis:64px;border-radius:12px}.recent-main b{font-size:16px}.recent-main .muted{font-size:11px}.recent-arrow{font-size:28px}
.quick-actions{display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf7;border:1px solid #eadfc9;border-radius:18px;padding:10px 4px;margin:14px 0 0;box-shadow:0 2px 8px rgba(115,70,30,.08)}
.quick-actions button{background:transparent;border:0;box-shadow:none;color:#26313a;min-height:72px;padding:4px 2px;font-size:10px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qa-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff0d5;font-size:23px;border:2px solid #f2dfbd}
.quick-actions button:nth-child(2) .qa-icon{background:#fff0df}.quick-actions button:nth-child(3) .qa-icon{background:#e5f2ff}.quick-actions button:nth-child(4) .qa-icon{background:#fff3d9}.quick-actions button:nth-child(5) .qa-icon{background:#e6f8ef}
.waves{height:20px;margin:0 -10px;background:radial-gradient(40px 18px at 40px 18px,transparent 68%,#e51f2a 70%,#e51f2a 78%,transparent 80%) 0 0/80px 20px repeat-x;opacity:.85}
.card{background:#fffdf7;border:1px solid #eadfc9;border-radius:18px;box-shadow:0 3px 12px rgba(115,70,30,.08);padding:15px}
button{border-radius:12px;font-weight:800}.type-btn.selected{background:var(--red);border-color:var(--red);box-shadow:0 2px 0 #a51a21}
nav{background:linear-gradient(180deg,#e51f2a,#c91624);height:82px;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(100,20,20,.22)}nav button{font-size:11px;color:#fff;min-height:64px}nav button.active{background:rgba(120,0,10,.35)!important;border-radius:12px}.fab{width:66px;height:66px;line-height:60px;bottom:92px;right:16px;background:#ef2b34;border:3px solid #fff7df;font-size:42px;box-shadow:0 5px 14px rgba(120,30,25,.3)}
.edit-actions{justify-content:flex-end}.edit-actions button{flex:0 0 auto;min-width:88px;background:#fffdf7;border:1px solid #eadfc9}
.photo-gallery{grid-template-columns:repeat(3,1fr)}.photo{height:150px}
@media(max-width:500px){main{padding:0 8px 20px}.stats{gap:5px}.stat{height:132px;border-radius:25px 25px 30px 30px;padding-top:9px}.stat-icon{font-size:24px;height:29px}.stat .label{font-size:10px}.stat .num{font-size:31px;margin-top:5px}.stat .unit{font-size:10px}.section-head{margin-top:15px}.section-title{font-size:19px}.recent-photo{width:56px;height:56px;flex-basis:56px}.quick-actions{gap:0;padding:7px 2px}.quick-actions button{font-size:8px;min-height:66px}.qa-icon{width:36px;height:36px;font-size:19px}.fab{bottom:91px}}
@media(max-width:380px){.stat{height:122px}.stat .label{font-size:9px}.stat .num{font-size:28px}.quick-actions button{font-size:7px}.qa-icon{width:32px;height:32px}}
</style>
</head>
<body>
<header aria-label="旅ログヘッダー"></header>
<main>
<section id="home">
<div class="home-panel">
<div class="stats">
<div class="stat"><div class="stat-icon">🏯</div><div class="label">城</div><div class="num" id="castleCount">0</div><div class="unit">カ所</div></div>
<div class="stat"><div class="stat-icon">📍</div><div class="label">スタンプ</div><div class="num" id="stampCount">0</div><div class="unit">カ所</div></div>
<div class="stat"><div class="stat-icon">🕳️</div><div class="label">マンホールカード</div><div class="num" id="manholeCount">0</div><div class="unit">枚</div></div>
<div class="stat"><div class="stat-icon">🌸</div><div class="label">御城印</div><div class="num" id="goshuinCount">0</div><div class="unit">枚</div></div>
</div>
<div class="section-head"><div class="section-title"><span class="pin">📍</span>最近の旅の記録</div><div class="more">もっと見る　›</div></div>
<div id="recent" class="recent-list muted">まだ記録がありません。</div>
<div class="quick-actions">
  <button type="button" onclick="startNew()"><span class="qa-icon">📷</span><span>写真</span></button>
  <button type="button" onclick="startNew()"><span class="qa-icon">📍</span><span>スタンプ・御城印</span></button>
  <button type="button" onclick="startNew();setTimeout(()=>selectType('マンホールカード'),0)"><span class="qa-icon">🕳️</span><span>マンホールカード</span></button>
  <button type="button" onclick="startNew()"><span class="qa-icon">￥</span><span>費用・メモ</span></button>
  <button type="button" onclick="show('settings')"><span class="qa-icon">☁️</span><span>バックアップ</span></button>
</div>
<div class="waves"></div>
</div>
<div class="card"><h3>このアプリについて</h3><p class="muted">入力したデータはこのiPhoneのブラウザ内に保存されます。サーバーには送信しません。</p></div>
</section>

<section id="add" class="hidden">
<div class="card">
<h2>➕ 旅を記録</h2>
<div class="notice">まず「何を記録するか」を選んでください。城ならスタンプ・御城印、マンホールカードならカード情報を追加で入力できます。</div>
<label>訪問日 <span class="req">＊</span></label><input id="date" type="date">
<label>記録する種類</label>
<div class="choice-grid" id="typeButtons"></div>
<label>場所・名称 <span class="req">＊</span></label><input id="place" placeholder="例：岐阜城、加古川市マンホールカード">
<div class="row">
<div><label>都道府県</label><input id="pref" placeholder="例：岐阜県"></div>
<div><label>市区町村</label><input id="city" placeholder="例：岐阜市"></div>
</div>

<div id="castleFields" class="hidden">
<label>城の区分</label><select id="castleClass"><option>100名城</option><option>続100名城</option><option>その他の城</option></select>
<label>取得状況</label>
<div class="checkgrid">
<label class="check"><input id="stamp" type="checkbox"> スタンプ取得</label>
<label class="check"><input id="goshuin" type="checkbox"> 御城印取得</label>
</div>
</div>

<div id="manholeFields" class="hidden">
<div class="row"><div><label>マンホールカード 第何弾</label><input id="manholeSeries" placeholder="例：第23弾"></div><div><label>カード番号</label><input id="manholeNo" placeholder="例：G001"></div></div>
<label>配布場所</label><input id="distribution" placeholder="例：○○観光案内所">
<label class="check"><input id="manholeGet" type="checkbox"> カード取得済み</label>
</div>

<label>費用（円）</label><input id="cost" type="number" inputmode="numeric" min="0" placeholder="0">
<label>メモ</label><textarea id="memo" placeholder="スタンプ取得、感想、駐車場、配布時間など"></textarea>
<label>写真</label>
<div class="row">
  <button type="button" onclick="document.getElementById('photoCamera').click()">📷 写真を撮る</button>
  <button type="button" class="secondary" onclick="document.getElementById('photoLibrary').click()">🖼️ 写真から選ぶ</button>
</div>
<input id="photoCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="setPhoto(event)">
<input id="photoLibrary" type="file" accept="image/*" multiple style="display:none" onchange="setPhotos(event)">
<div class="help">写真は複数枚追加できます。写真から選ぶ場合は複数枚をまとめて選択できます。</div>
<div id="photoPreview" class="photo-preview"></div>
<div class="row" style="margin-top:14px"><button onclick="saveEntry()">💾 この記録を保存</button><button class="secondary" onclick="clearForm()">クリア</button></div>
</div></section>

<section id="list" class="hidden"><div class="card"><h2>📚 記録一覧</h2><div id="entries"></div></div></section>

<section id="settings" class="hidden"><div class="card"><h2>⚙️ データ管理</h2><p class="muted">機種変更やバックアップのため、記録をファイルに書き出せます。</p><div class="row"><button onclick="exportData()">バックアップを書き出す</button><button class="secondary" onclick="document.getElementById('importFile').click()">復元する</button></div><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"><hr><button class="secondary danger" onclick="resetData()">全データを削除</button></div></section>
</main>
<nav><button id="n-home" class="active" onclick="show('home')">🏠<br>ホーム</button><button id="n-map" onclick="show('home')">📍<br>マップ</button><button id="n-add" onclick="show('add')">🌸<br>記録する</button><button id="n-list" onclick="show('list')">☷<br>一覧</button><button id="n-settings" onclick="show('settings')">⚙️<br>設定</button></nav><button class="fab" type="button" onclick="startNew()">＋</button>
<div id="toast" class="toast hidden"></div>
<script>
const KEY="tabi_log_v1";
const TYPES=["100名城","続100名城","その他の城","マンホールカード","観光","食事","その他"];
let data=[];
let editId=null;
try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[];}catch(e){data=[];}
const $=id=>document.getElementById(id);

function today(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
$("date").value=today();

function initTypeButtons(){
 $("typeButtons").innerHTML=TYPES.map(t=>`<button type="button" class="type-btn" data-type="${t}" onclick="selectType('${t}')">${icon(t)} ${t}</button>`).join("");
 selectType("100名城");
}
function icon(t){return {"100名城":"🏯","続100名城":"🏯","その他の城":"🏰","マンホールカード":"🕳️","観光":"📍","食事":"🍜","その他":"📝"}[t]||"📝";}
function currentType(){const b=document.querySelector(".type-btn.selected");return b?b.dataset.type:"100名城";}
function selectType(t){
 document.querySelectorAll(".type-btn").forEach(b=>b.classList.toggle("selected",b.dataset.type===t));
 $("castleFields").classList.toggle("hidden",!t.includes("城"));
 $("manholeFields").classList.toggle("hidden",t!=="マンホールカード");
}

function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function show(id){["home","add","list","settings"].forEach(x=>$(x).classList.toggle("hidden",x!==id));["home","add","list","settings"].forEach(x=>$(`n-${x}`).classList.toggle("active",x===id));$("n-map").classList.remove("active");if(id==="list")renderList();window.scrollTo({top:0,behavior:"smooth"});}

function compressImage(file,done){
 if(!file){done("");return;}
 const reader=new FileReader();reader.onload=()=>{
  const img=new Image();img.onload=()=>{const max=1600;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);done(c.toDataURL("image/jpeg",.82));};img.src=reader.result;
 };reader.readAsDataURL(file);
}

function imageToDataURL(file,done){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      done(c.toDataURL("image/jpeg",0.75));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function setPhoto(e){
  const f=e.target.files?.[0];
  if(!f) return;
  imageToDataURL(f,(url)=>{
    photoData.push(url); renderPhotoPreview(); toast("写真を追加しました");
  });
  e.target.value="";
}
function setPhotos(e){
  const files=[...(e.target.files||[])];
  if(!files.length) return;
  let remaining=files.length;
  files.forEach(f=>imageToDataURL(f,(url)=>{
    photoData.push(url);
    remaining--;
    if(remaining===0){renderPhotoPreview();toast(files.length+"枚の写真を追加しました");}
  }));
  e.target.value="";
}
function removePhoto(i){photoData.splice(i,1);renderPhotoPreview();}
function renderPhotoPreview(){
  $("photoPreview").innerHTML=photoData.length
    ? photoData.map((src,i)=>`<div class="photo-thumb"><img src="${src}" alt="写真${i+1}"><button type="button" class="photo-remove" onclick="removePhoto(${i})">×</button></div>`).join("")
    : "";
}
let photoData=[];
function saveEntry(){
 const place=$("place").value.trim();if(!place){alert("場所・名称を入力してください");return;}
 const type=currentType();
 const entry={id:editId??Date.now(),date:$("date").value||today(),place,type,pref:$("pref").value.trim(),city:$("city").value.trim(),castleClass:$("castleClass").value,stamp:$("stamp").checked,goshuin:$("goshuin").checked,manholeSeries:$("manholeSeries").value.trim(),manholeNo:$("manholeNo").value.trim(),distribution:$("distribution").value.trim(),manholeGet:$("manholeGet").checked,memo:$("memo").value.trim(),cost:Number($("cost").value||0),photo:photoData[0]||"",photos:photoData.slice()};
 if(editId!==null){const i=data.findIndex(x=>x.id===editId);if(i>=0)data[i]=entry;else data.unshift(entry);}else data.unshift(entry);
 save();clearForm();toast(editId!==null?"記録を更新しました！":"保存しました！");show("list");
}
function startNew(){editId=null;clearForm();show("add");}
function startEdit(id){
 const x=data.find(v=>v.id===id);if(!x)return;editId=id;$("date").value=x.date||today();$("place").value=x.place||"";$("pref").value=x.pref||"";$("city").value=x.city||"";$("castleClass").value=x.castleClass||"100名城";$("stamp").checked=!!x.stamp;$("goshuin").checked=!!x.goshuin;$("manholeSeries").value=x.manholeSeries||"";$("manholeNo").value=x.manholeNo||"";$("distribution").value=x.distribution||"";$("manholeGet").checked=!!x.manholeGet;$("memo").value=x.memo||"";$("cost").value=x.cost||"";photoData=Array.isArray(x.photos)&&x.photos.length?x.photos.slice():(x.photo?[x.photo]:[]);selectType(x.type||"100名城");
 renderPhotoPreview();$("add").querySelector("h2").textContent="✏️ 記録を編集";show("add");
}
function clearForm(){
 editId=null;$("add").querySelector("h2").textContent="➕ 旅を記録";
 $("date").value=today();$("place").value="";$("pref").value="";$("city").value="";$("castleClass").value="100名城";$("stamp").checked=false;$("goshuin").checked=false;$("manholeSeries").value="";$("manholeNo").value="";$("distribution").value="";$("manholeGet").checked=false;$("memo").value="";$("cost").value="";photoData=[];$("photoPreview").innerHTML="";selectType("100名城");
}

function del(id){if(confirm("この記録を削除しますか？")){data=data.filter(x=>x.id!==id);save();renderList();toast("削除しました");}}
function render(){
 $("castleCount").textContent=data.filter(x=>x.type&&x.type.includes("城")).length;
 $("stampCount").textContent=data.filter(x=>x.stamp).length;
 $("manholeCount").textContent=data.filter(x=>x.type==="マンホールカード"&&(x.manholeGet!==false)).length;
 $("goshuinCount").textContent=data.filter(x=>x.goshuin).length;
 const r=$("recent");r.innerHTML=data.length?data.slice(0,5).map(x=>`<div class="recent-row">${(x.photos?.[0]||x.photo)?`<img class="recent-photo" src="${x.photos?.[0]||x.photo}" alt="">`:`<span class="recent-photo" style="display:inline-flex;align-items:center;justify-content:center;background:#f2dfc8">${icon(x.type)}</span>`}<div class="recent-main"><b>${esc(x.place)}</b><div class="muted">${esc(x.date||"")} ・ ${esc(x.pref||"")} ${esc(x.city||"")}</div><div class="recent-tags"><span class="mini-tag">${esc(x.type)}</span>${x.stamp?`<span class="mini-tag green">スタンプ</span>`:""}${x.goshuin?`<span class="mini-tag purple">御城印</span>`:""}${x.type==="マンホールカード"?`<span class="mini-tag blue">マンホールカード</span>`:""}</div></div><span class="recent-arrow">›</span></div>`).join(""):"まだ記録がありません。";
}
function renderList(){
 const e=$("entries");
 if(!data.length){e.innerHTML='<p class="muted">まだ記録がありません。下の「➕ 記録」から追加してください。</p>';return;}
 e.innerHTML=data.map(x=>{
  const area=[x.pref,x.city].filter(Boolean).join(" ");
  const castle=x.type&&x.type.includes("城")?`<div class="muted">${esc(x.castleClass||x.type)} ${x.stamp?"・⭕スタンプ": "・⬜スタンプ未取得"} ${x.goshuin?"・⭕御城印":""}</div>`:"";
  const mh=x.type==="マンホールカード"?`<div class="muted">${esc(x.manholeSeries||"")} ${esc(x.manholeNo||"")} ${x.manholeGet?"・⭕取得済み":"・⬜未取得"}${x.distribution?"・配布："+esc(x.distribution):""}</div>`:"";
  return `<div class="item"><div class="item-head"><div><b>${esc(x.place)}</b>${area?`<div class="muted">📍 ${esc(area)}</div>`:""}</div><span class="badge">${icon(x.type)} ${esc(x.type)}</span></div><div class="muted">${esc(x.date||"")}　¥${Number(x.cost||0).toLocaleString()}</div>${castle}${mh}${x.memo?`<p>${esc(x.memo)}</p>`:""}${(x.photos?.length||x.photo)?`<div class="photo-gallery">${(x.photos?.length?x.photos:[x.photo]).map((src,i)=>`<img class="photo" src="${src}" alt="${esc(x.place)}の写真${i+1}">`).join("")}</div>`:""}<div class="edit-actions"><button type="button" onclick="startEdit(${x.id})">✏️ 編集</button><button type="button" class="secondary danger" onclick="del(${x.id})">🗑️ 削除</button></div></div>`;
 }).join("");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add("hidden"),1800);}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tabi-log-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;save();renderList();alert("復元しました");}catch(e){alert("バックアップファイルを読み込めませんでした")}ev.target.value="";};r.readAsText(f);}
function resetData(){if(confirm("すべての記録を削除します。よろしいですか？")){data=[];save();renderList();}}
initTypeButtons();render();
</script>
</body></html>
