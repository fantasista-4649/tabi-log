<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>旅ログ</title><style>body{font-family:-apple-system,sans-serif;background:#f6f6f6;margin:0;color:#222}header{background:#fff;padding:18px 16px;border-bottom:1px solid #ddd}main{padding:14px;max-width:720px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}label{display:block;color:#666;font-size:13px;margin:9px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:90px}button{padding:11px 15px;border:0;border-radius:12px;background:#222;color:#fff;margin-top:10px}.secondary{background:#eee;color:#222}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.entry{border-top:1px solid #eee;margin-top:12px;padding-top:12px}.entry img{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-top:8px}</style></head><body><header><h1>📖 旅ログ</h1><div>写真と旅の思い出を記録</div></header><main><div class="card"><label>日付</label><input id="d" type="date"><label>場所</label><input id="p" placeholder="例：姫路城"><label>メモ</label><textarea id="m" placeholder="旅の思い出"></textarea><label>写真</label><input id="f" type="file" accept="image/*" multiple><div id="pv" class="preview"></div><button id="s">💾 記録を保存</button> <button id="c" class="secondary">クリア</button></div><div class="card"><b>保存した旅ログ</b><div id="list"></div></div></main><script>const K='tabiLogV1';let fs=[];d.value=new Date().toISOString().slice(0,10);f.onchange=e=>{fs=[...e.target.files];pv.innerHTML='';fs.forEach(x=>{let i=document.createElement('img');i.src=URL.createObjectURL(x);pv.appendChild(i)})};c.onclick=()=>{fs=[];f.value='';pv.innerHTML='';p.value='';m.value=''};s.onclick=async()=>{let a=JSON.parse(localStorage.getItem(K)||'[]');let pics=await Promise.all(fs.map(x=>new Promise(r=>{let q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(x)})));a.unshift({d:d.value,p:p.value,m:m.value,pics});try{localStorage.setItem(K,JSON.stringify(a));render();c.click();alert('保存しました')}catch(e){alert('写真が大きすぎます。枚数を減らしてください')}};function render(){let a=JSON.parse(localStorage.getItem(K)||'[]');list.innerHTML=a.length?a.map((x,i)=>`<div class="entry"><b>${x.d}　${x.p}</b><p>${x.m}</p>${(x.pics||[]).map(q=>`<img src="${q}">`).join('')}<br><button class="secondary" onclick="del(${i})">削除</button></div>`).join(''):'<p>まだ記録はありません。</p>'}function del(i){let a=JSON.parse(localStorage.getItem(K)||'[]');a.splice(i,1);localStorage.setItem(K,JSON.stringify(a));render()}render();</script></body></html>
